name: Toolchain transfer probe

on:
  push:
    branches:
      - arena/7535fc36-pojavlauncher
    paths:
      - .github/workflows/toolchain-probe.yml

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 0
          persist-credentials: true

      - name: Create and commit probe payload
        run: |
          mkdir -p toolchain-transfer
          printf 'toolchain-probe %s\n' "$(date -u +%FT%TZ)" > toolchain-transfer/probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain-transfer/probe.txt
          git commit -m "CI[probe]: publish transfer payload" || echo "nothing to commit"
          git push origin HEAD:arena/7535fc36-pojavlauncher
