name: SDK build-tools 35 transfer

on:
  push:
    branches:
      - arena/7535fc36-pojavlauncher
    paths:
      - .github/workflows/sdk35-transfer.yml

permissions:
  contents: write

concurrency:
  group: sdk35-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            /*
            !/toolchain-transfer/
            !/apk-transfer/
          sparse-checkout-cone-mode: false

      - name: Package official Android SDK Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          test -d "$SDK/build-tools/35.0.0"
          grep -E 'Pkg.Revision=' "$SDK/build-tools/35.0.0/source.properties"
          rm -rf /tmp/sdk35
          mkdir -p /tmp/sdk35/payload/logs /tmp/sdk35/payload/metadata /tmp/sdk35/payload/sdk
          mkdir -p /tmp/sdk35/payload/sdk/build-tools
          cp -a "$SDK/build-tools/35.0.0" /tmp/sdk35/payload/sdk/build-tools/
          tar -czf /tmp/sdk35/payload/build-tools-35.0.0.tar.gz -C /tmp/sdk35/payload/sdk build-tools/35.0.0
          test -f /tmp/sdk35/payload/build-tools-35.0.0.tar.gz
          sha256sum /tmp/sdk35/payload/build-tools-35.0.0.tar.gz > /tmp/sdk35/payload/metadata/archive.sha256
          split -b 16m -d -a 4 /tmp/sdk35/payload/build-tools-35.0.0.tar.gz /tmp/sdk35/payload/part_
          (cd /tmp/sdk35/payload && sha256sum part_* > metadata/parts.sha256)
          {
            echo "date=$(date -u +%FT%TZ)"
            echo "commit=$(git rev-parse HEAD)"
            echo "archive=build-tools-35.0.0.tar.gz"
            echo "archive_sha256=$(awk '{print $1}' /tmp/sdk35/payload/metadata/archive.sha256)"
            echo "part_count=$(find /tmp/sdk35/payload -maxdepth 1 -name 'part_*' | wc -l)"
            echo "part_size_bytes=16777216"
            echo "sdk_path=$SDK/build-tools/35.0.0"
            cat "$SDK/build-tools/35.0.0/source.properties"
          } > /tmp/sdk35/payload/metadata/manifest.txt
          cat /tmp/sdk35/payload/metadata/manifest.txt

      - name: Commit SDK transfer parts to active branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf sdk-transfer
          mkdir -p sdk-transfer/metadata sdk-transfer/parts
          cp -f /tmp/sdk35/payload/metadata/* sdk-transfer/metadata/
          cp -f /tmp/sdk35/payload/part_* sdk-transfer/parts/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A sdk-transfer/metadata
          git commit -m "CI[sdk]: add official build-tools 35.0.0 manifest"
          git push --porcelain origin HEAD:refs/heads/arena/7535fc36-pojavlauncher
          shopt -s nullglob
          parts=(sdk-transfer/parts/part_*)
          echo "publishing ${#parts[@]} SDK parts"
          batch=0
          for ((i=0; i<${#parts[@]}; i+=4)); do
            batch=$((batch+1))
            chunk=("${parts[@]:i:4}")
            git add -- "${chunk[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "CI[sdk]: publish build-tools 35.0.0 parts batch $batch"
              git push --porcelain origin HEAD:refs/heads/arena/7535fc36-pojavlauncher
            fi
          done
          echo "local_head=$(git rev-parse HEAD)"
