name: PojavLauncher Renewed release

# Verification and publication pipeline for the Ultra-Optimization feature branch.
#
# A push runs the full verification and builds both debug APK variants, but does NOT publish
# anything: repository pushes must never create a release on their own. Publishing the NEW
# release (tag pojavlauncher-renewed-<date>, its own asset names, never touching the previous
# pojavlauncher-debug-apks-20261126 release) is an explicit opt-in: run this workflow manually
# with the "publish" input checked.

on:
  push:
    branches:
      - arena/7535fc36-pojavlauncher
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create or update the PojavLauncher Renewed GitHub Release with the built APKs'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: renewed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Static verification and offline resolution tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ultra-Lite preservation and Ultra-Optimization safety checks
        run: python3 scripts/verify_ultra_optimization.py

      - name: Repository-wide static verification
        run: python3 scripts/verify_static.py

      - name: Ultra-Optimization offline resolution tests (javac --release 8 + java)
        run: bash scripts/run_ultra_optimization_tests.sh

  release:
    name: Build, verify and publish the Renewed APKs
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CURSEFORGE_API_KEY: DUMMY
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      RELEASE_TAG: pojavlauncher-renewed-20261126
      RELEASE_TITLE: PojavLauncher Renewed
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Install official Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER='${{ steps.sdk.outputs.sdkmanager }}'
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build both debug APK variants
        shell: bash
        run: |
          set -euo pipefail
          gradle :app_pojavlauncher:assembleNoruntimeDebug :app_pojavlauncher:assembleFullDebug \
            --no-daemon --console=plain

      - name: Re-run safety checks against the built tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_ultra_optimization.py
          python3 - <<'PY'
          import os
          # The feature sources must be inside the built APKs' source tree, and no Ultra-Lite
          # file may have been edited by the build itself.
          feature = 'app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/ultraoptimization'
          names = sorted(os.listdir(feature))
          assert 'UltraOptimizationFragment.java' in names, names
          assert 'UltraOptimizationInstaller.java' in names, names
          print('feature sources in build tree:', len(names))
          PY

      - name: Verify and describe APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          export PATH="$BT:$JAVA_HOME/bin:$PATH"
          FULL=app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
          NORUNTIME=app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk
          test -s "$FULL"
          test -s "$NORUNTIME"
          cp -f "$FULL" PojavLauncher-Renewed-Full.apk
          cp -f "$NORUNTIME" PojavLauncher-Renewed-Noruntime.apk
          gradle --version > gradle-version-full.txt
          java -version > java-version-full.txt 2>&1
          {
            echo "PojavLauncher Renewed - APK verification"
            echo "date=$(date -u +%FT%TZ)"
            echo "source_commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "gradle=$(grep '^Gradle ' gradle-version-full.txt | head -1)"
            echo "java=$(head -1 java-version-full.txt)"
            echo "javac=$(javac -version 2>&1)"
            echo
            echo "== static verification =="
            echo "ultra_lite_preservation_and_safety_checks=passed (verify_ultra_optimization.py)"
            echo "repository_static_verification=passed (verify_static.py)"
            echo "offline_resolution_tests=passed (scripts/run_ultra_optimization_tests.sh)"
            echo "  scenarios: Fabric 1.20.1/LTW, Forge 1.20.1/GL4ES, NeoForge 1.21.1/Zink,"
            echo "  Quilt 1.19.2, Vanilla, shared-data, old runtime, installed detection,"
            echo "  required-dependency failure, incompatible conflict, exclusive culling group"
            echo
            for apk in PojavLauncher-Renewed-Full.apk PojavLauncher-Renewed-Noruntime.apk; do
              echo "=== $apk ==="
              echo "size_bytes=$(stat -c%s "$apk")"
              echo "sha256=$(sha256sum "$apk" | awk '{print $1}')"
              unzip -t "$apk" >/dev/null
              echo "zip_integrity=ok"
              aapt dump badging "$apk" | grep -E '^(package|sdkVersion|targetSdkVersion|native-code|application-label:)' || true
              apksigner verify "$apk" >/dev/null
              echo "apksigner_verify=ok"
              apksigner verify --print-certs "$apk" 2>/dev/null | grep -E 'Signer #1 certificate (DN|SHA-256 digest)' || true
              zipalign -c -v 4 "$apk" | tail -1
              echo "abis=$(unzip -l "$apk" | awk '/ lib\/[^\/]+\/.*\.so$/ {split($4,a,"/"); print a[2]}' | sort -u | tr '\n' ' ')"
              echo
            done
            echo "Not performed by CI: installation and runtime testing on a physical Android device,"
            echo "live Modrinth API queries, and end-to-end mod installation on a device."
          } | tee release-verification.txt
          : > apk-metadata.txt
          for apk in PojavLauncher-Renewed-Full.apk PojavLauncher-Renewed-Noruntime.apk; do
            badging=$(aapt dump badging "$apk")
            stem=${apk%.apk}
            pkg=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            vcode=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            vname=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            minsdk=$(printf '%s\n' "$badging" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p")
            targetsdk=$(printf '%s\n' "$badging" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p")
            abis=$(printf '%s\n' "$badging" | sed -n 's/^native-code: //p' | tr -d "'" | tr ' ' ',' | sed 's/,$//')
            size=$(stat -c%s "$apk")
            sha=$(sha256sum "$apk" | awk '{print $1}')
            signer=$(apksigner verify --print-certs "$apk" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            {
              echo "$stem.package=$pkg"
              echo "$stem.versionName=$vname"
              echo "$stem.versionCode=$vcode"
              echo "$stem.minSdk=$minsdk"
              echo "$stem.targetSdk=$targetsdk"
              echo "$stem.abis=$abis"
              echo "$stem.size_bytes=$size"
              echo "$stem.sha256=$sha"
              echo "$stem.debug_signer_sha256=$signer"
            } >> apk-metadata.txt
          done
          cat apk-metadata.txt

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          FULL_SIZE=$(grep '^PojavLauncher-Renewed-Full\.size_bytes=' apk-metadata.txt | cut -d= -f2)
          FULL_SHA=$(grep '^PojavLauncher-Renewed-Full\.sha256=' apk-metadata.txt | cut -d= -f2)
          NORUNTIME_SIZE=$(grep '^PojavLauncher-Renewed-Noruntime\.size_bytes=' apk-metadata.txt | cut -d= -f2)
          NORUNTIME_SHA=$(grep '^PojavLauncher-Renewed-Noruntime\.sha256=' apk-metadata.txt | cut -d= -f2)
          {
            echo "## PojavLauncher Renewed"
            echo
            echo "New in this build: **Ultra-Optimization**, a per-installation mod optimizer. It is a"
            echo "separate feature with its own screen, its own state and its own lifecycle; the existing"
            echo "**Ultra-Lite** launcher profile is untouched and keeps working exactly as before."
            echo
            echo "### Ultra-Optimization (new)"
            echo
            echo "Opens from **Settings -> Categories -> Ultra-Optimization** for the selected installation."
            echo
            echo "- Detects the exact Minecraft version and the loader of the selected installation (Fabric,"
            echo "  Forge, NeoForge, Quilt, or Vanilla) from its version JSON."
            echo "- Reads the active renderer and the selected Java runtime, and reports the compatibility"
            echo "  constraints it found. It never changes the renderer or the runtime."
            echo "- Queries the official Modrinth API (\`https://api.modrinth.com/v2\`) for the exact"
            echo "  version + loader pair, keeps only listed release/beta files with a primary JAR and a"
            echo "  SHA-512/SHA-1 hash, resolves required dependencies, and drops conflicts, unlisted,"
            echo "  archived and abandoned builds. No fixed mod list is installed."
            echo "- Evaluates the investigated candidates - FerriteCore, Lithium, Sodium, ModernFix,"
            echo "  ImmediatelyFast, Entity Culling, More Culling and Memory Leak Fix - and installs only"
            echo "  the ones that are actually compatible and missing, within a cost-aware selection budget."
            echo "- Sodium is validated against the renderer: it is offered on the LTW path for"
            echo "  Minecraft 1.17+ and otherwise skipped with an explicit reason (GL4ES is blocked by the"
            echo "  launcher for Sodium on 1.17+, and other renderers are not verified here)."
            echo "- Renderers are classified from the launcher's own identifiers: LTW, GL4ES (including the"
            echo "  legacy opengles2_4 / opengles2_5 aliases), Krypton Wrapper (NG-GL4ES), Zink, Legacy Zink,"
            echo "  Mesa, Freedreno, MobileGlues and SFPEW each carry the OpenGL ES / desktop-GL version their"
            echo "  RenderSpec actually requests. An unknown tag is treated as unknown, never as one of them."
            echo "- Downloads are staged, verified by size and hash, then moved into the installation's"
            echo "  mods directory. Existing files are never overwritten without confirmation, unrelated"
            echo "  mods are never removed, duplicates are skipped, and configs are left alone."
            echo "- **Restore** removes only what Ultra-Optimization installed and puts back anything it"
            echo "  displaced. State lives in \`<installation>/.ultra_optimization/state.json\`."
            echo "- On-demand only: no service, no polling, no startup scan, no automatic download, no"
            echo "  modpack handling, and a small bounded cache of Modrinth responses."
            echo
            echo "Vanilla installations are never modified and are never converted to a loader; shared"
            echo "game directories are refused so another installation cannot be touched."
            echo
            echo "### Ultra-Lite (unchanged)"
            echo
            echo "Global launcher profile under **Settings -> Categories -> Miscellaneous settings ->"
            echo "Performance profile**: reduced background work and cache, lower progress refresh rate,"
            echo "and an optional conservative heap size on low-RAM devices. Balanced / Ultra-Lite / Custom"
            echo "behave exactly as in the previous release; the profile files and defaults were verified"
            echo "byte-identical to the reviewed baseline by \`scripts/verify_ultra_optimization.py\`."
            echo
            echo "The two features are independent, so all four combinations work:"
            echo
            echo "| Ultra-Lite | Ultra-Optimization | Behaviour |"
            echo "| --- | --- | --- |"
            echo "| OFF | OFF | Normal launcher |"
            echo "| ON | OFF | Lightweight launcher |"
            echo "| OFF | ON | Minecraft optimized through mods |"
            echo "| ON | ON | Both simultaneously |"
            echo
            echo "### Supported Minecraft versions and loaders (as actually verified)"
            echo
            echo "Verified offline against fixture responses for the resolution policy, in these combinations:"
            echo
            echo "- Fabric 1.20.1 with LTW (dependency resolution, cost budget)"
            echo "- Forge 1.20.1 with GL4ES (Sodium correctly skipped with a reason)"
            echo "- NeoForge 1.21.1 with Zink (Sodium skipped, other mods offered)"
            echo "- Quilt 1.19.2 (Fabric builds accepted only for Quilt-capable projects)"
            echo "- Krypton Wrapper / NG-GL4ES: classified as its own family (OpenGL ES 3, desktop OpenGL 3.1"
            echo "  pinned via LIBGL_GL=31), Sodium withheld with a stated reason, non-rendering mods and their"
            echo "  required dependencies still offered"
            echo "- Standard GL4ES legacy aliases, and an unrecognised renderer tag as a conservative fallback"
            echo "- Vanilla, shared-game-directory and under-Java-runtime installations (refused, no changes)"
            echo
            echo "At runtime the exact Minecraft version and loader of the selected installation decide"
            echo "which mods Modrinth returns; unsupported or unverified combinations are skipped with an"
            echo "explanation instead of being installed. No live Modrinth query and no on-device run was"
            echo "performed by CI."
            echo
            echo "### Build information"
            echo
            echo "- Source: branch \`$GITHUB_REF_NAME\` at \`$GITHUB_SHA\`, built by GitHub Actions."
            echo "- Gradle 8.14.5 (official distribution, SHA-256 \`6f74b601422d6d6fc4e1f9a1ab6522f642c2fdcbc15ae33ebd30ba3d7198e854\`), JDK 17 (Temurin), Android SDK platform 36, build-tools 35.0.0/36.0.0, NDK 29.0.14206865, CMake 3.22.1."
            echo "- Debug variants with the standard Android debug keystore; no release APK is published"
            echo "  because this project has no release signing configuration (a release APK would be"
            echo "  unsigned and uninstallable)."
            echo "- Package \`$(grep '^PojavLauncher-Renewed-Full\.package=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  minSdk \`$(grep '^PojavLauncher-Renewed-Full\.minSdk=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  targetSdk \`$(grep '^PojavLauncher-Renewed-Full\.targetSdk=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  versionName \`$(grep '^PojavLauncher-Renewed-Full\.versionName=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  ABIs \`$(grep '^PojavLauncher-Renewed-Full\.abis=' apk-metadata.txt | cut -d= -f2 | tr ',' ' ')\`"
            echo "  (read from \`aapt dump badging\` on the built APKs; see \`apk-metadata.txt\`)."
            echo "- Verification: \`unzip -t\`, \`apksigner verify\`, \`zipalign -c -v 4\`, \`aapt dump badging\` - see \`release-verification.txt\`."
            echo
            echo "### APK assets and SHA-256"
            echo
            echo "| Asset | Size (bytes) | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`PojavLauncher-Renewed-Full.apk\` | $FULL_SIZE | \`$FULL_SHA\` |"
            echo "| \`PojavLauncher-Renewed-Noruntime.apk\` | $NORUNTIME_SIZE | \`$NORUNTIME_SHA\` |"
            echo
            echo "The **Full** APK bundles the Java runtimes. The **Noruntime** APK is smaller and lets the"
            echo "launcher download a runtime on first use. Install the variant that matches your device;"
            echo "do not mix them with the previous release's APKs."
            echo
            echo "### Installation and upgrade"
            echo
            echo "1. If a PojavLauncher fork is already installed, install this APK over it (same"
            echo "   \`net.kdt.pojavlaunch.debug\` package). If the signature differs, uninstall the old"
            echo "   debug build first; your \`games/PojavLauncher\` data directory is not removed by that."
            echo "2. Open **Settings -> Categories -> Ultra-Optimization** with the installation selected on"
            echo "   the main screen. The screen scans it once, on demand."
            echo "3. Review the mod list (will install / already installed / skipped and why), then press"
            echo "   **Optimize** and confirm. Progress and per-file results are shown on the same screen."
            echo "4. Press **Restore** to undo: only the files Ultra-Optimization installed are removed and"
            echo "   displaced files are put back."
            echo "5. Ultra-Lite stays where it was: **Settings -> Categories -> Miscellaneous settings ->"
            echo "   Performance profile**. Enabling both is supported."
            echo
            echo "### Known limitations"
            echo
            echo "- Renderer compatibility: Sodium is offered only on LTW for Minecraft 1.17+. With GL4ES the"
            echo "  launcher refuses that combination, so Ultra-Optimization skips Sodium instead of switching"
            echo "  renderers; Zink, MobileGlues, Mesa and other renderers are not treated as verified for"
            echo "  Sodium either. Sodium-family mods already present (Embeddium, Rubidium, Angelica) suppress"
            echo "  Sodium to avoid a conflict."
            echo "- Older Minecraft (before 1.17) and GL4ES-only devices get the non-rendering mods only."
            echo "- Krypton Wrapper (NG-GL4ES) is recognised and optimized, but it is a GL4ES derivative that"
            echo "  pins emulated desktop OpenGL 3.1: Sodium and Sodium-family renderer mods are withheld"
            echo "  because neither this repository nor the launcher's own checks validate that combination, not"
            echo "  because the wrapper is considered unusable. The launcher applies neither its GL4ES Sodium"
            echo "  guard nor its version cutoff to Krypton, so Ultra-Optimization does not invent one either;"
            echo "  the reported on-device success with non-rendering mods is user evidence, not a CI result."
            echo "- Installations using a shared game directory, unresolved version aliases, or a Java"
            echo "  runtime older than the version requires are refused without changes."
            echo "- The mod list depends on what Modrinth currently publishes for that exact version/loader;"
            echo "  nothing is installed when no compatible, hashed, listed file exists."
            echo "- Debug build: expect debug-level overhead, and keep the previous release's APKs if you"
            echo "  need the earlier state."
            echo "- Not verified by CI: installing or launching on a physical Android device, live Modrinth"
            echo "  responses, and real frame-time measurements."
          } > release-notes.md
          cat release-notes.md

      - name: Publication gate
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publication=enabled (explicit workflow_dispatch with the publish input)"
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "publication=skipped: the '${{ github.event_name }}' event only verifies and"
            echo "  builds both debug APKs. Run the workflow manually with the 'publish' input"
            echo "  checked to create or update the GitHub Release."
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the new GitHub Release
        if: steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          DIAG=/tmp/publish-diagnostics.txt
          : > "$DIAG"
          PUBLISH_FAILED=0
          note() { printf '%s\n' "$1" | tee -a "$DIAG"; }
          run_step() {
            label="$1"; shift
            if "$@" >>"$DIAG" 2>&1; then
              note "OK   $label"
            else
              code=$?
              note "FAIL $label (exit $code)"
              sed -e 's/^/     | /' "$DIAG" | tail -n 25
              PUBLISH_FAILED=1
            fi
          }
          ASSETS=()
          for candidate in PojavLauncher-Renewed-Full.apk PojavLauncher-Renewed-Noruntime.apk release-verification.txt apk-metadata.txt; do
            if [ -s "$candidate" ]; then ASSETS+=("$candidate"); else note "WARN missing asset $candidate"; fi
          done
          note "assets=${ASSETS[*]}"
          note "tag=$RELEASE_TAG sha=$GITHUB_SHA repo=$GITHUB_REPOSITORY"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            note "release exists"
            run_step "upload-assets" gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
            run_step "refresh-notes" gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id 2>>"$DIAG")
            note "release_id=$RELEASE_ID"
            if [ -n "$RELEASE_ID" ]; then
              run_step "refresh-target" gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f target_commitish="$GITHUB_SHA" --jq .tag_name
            else
              note "FAIL refresh-target (no release id)"
              PUBLISH_FAILED=1
            fi
          else
            note "creating release"
            run_step "create-release" gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          fi
          run_step "show-release" gh release view "$RELEASE_TAG" --json url,tagName,name,isPrerelease,targetCommitish,assets --jq '{url,tagName,name,isPrerelease,targetCommitish,assets:[.assets[]|{name,size,digest}]}'
          note "previous-release-check"
          run_step "show-previous" gh release view pojavlauncher-debug-apks-20261126 --json url,tagName --jq '{url,tagName}'
          note "result=$([ "$PUBLISH_FAILED" -eq 0 ] && echo ok || echo failed)"
          exit "$PUBLISH_FAILED"

      - name: Expose publishing diagnostics on the release
        if: always() && steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          DIAG=/tmp/publish-diagnostics.txt
          test -s "$DIAG" || { echo "no diagnostics to publish"; exit 0; }
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG does not exist; printing diagnostics instead"
            cat "$DIAG"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/body.md
          printf '\n<!-- publish-diagnostics (machine readable, not rendered)\n' >> /tmp/body.md
          sed -e 's/-->/_/g' "$DIAG" >> /tmp/body.md
          printf -- '-->\n' >> /tmp/body.md
          DIAG_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DIAG_ID" -F body=@/tmp/body.md --jq .html_url
