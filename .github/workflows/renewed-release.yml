name: PojavLauncher Renewed release

# Verification and publication pipeline for the Ultra-Optimization feature branch.
#
# A push runs the full verification and builds both debug APK variants, but does NOT publish
# anything: repository pushes must never create a release on their own. Publishing the NEW
# release (tag pojavlauncher-renewed-<date>, its own asset names, never touching the previous
# pojavlauncher-debug-apks-20261126 release) is an explicit opt-in: run this workflow manually
# with the "publish" input checked.

on:
  push:
    branches:
      - arena/7535fc36-pojavlauncher
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create or update the PojavLauncher Renewed GitHub Release with the built APKs'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: renewed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Static verification and offline resolution tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ultra-Lite preservation and Ultra-Optimization safety checks
        run: python3 scripts/verify_ultra_optimization.py

      - name: Repository-wide static verification
        run: python3 scripts/verify_static.py

      - name: Ultra-Optimization offline resolution tests (javac --release 8 + java)
        run: bash scripts/run_ultra_optimization_tests.sh

  release:
    name: Build, verify and publish the Renewed APKs
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CURSEFORGE_API_KEY: DUMMY
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      RELEASE_TAG: pojavlauncher-renewed-20261126
      RELEASE_TITLE: PojavLauncher Renewed
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Install official Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER='${{ steps.sdk.outputs.sdkmanager }}'
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build both debug APK variants
        shell: bash
        run: |
          set -euo pipefail
          gradle :app_pojavlauncher:assembleNoruntimeDebug :app_pojavlauncher:assembleFullDebug \
            --no-daemon --console=plain

      - name: Re-run safety checks against the built tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_ultra_optimization.py
          python3 - <<'PY'
          import os
          # The feature sources must be inside the built APKs' source tree, and no Ultra-Lite
          # file may have been edited by the build itself.
          feature = 'app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/ultraoptimization'
          names = sorted(os.listdir(feature))
          assert 'UltraOptimizationFragment.java' in names, names
          assert 'UltraOptimizationInstaller.java' in names, names
          print('feature sources in build tree:', len(names))
          PY

      - name: Verify and describe APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          export PATH="$BT:$JAVA_HOME/bin:$PATH"
          FULL=app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
          NORUNTIME=app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk
          test -s "$FULL"
          test -s "$NORUNTIME"
          cp -f "$FULL" PojavLauncher-Renewed-Full.apk
          cp -f "$NORUNTIME" PojavLauncher-Renewed-Noruntime.apk
          gradle --version > gradle-version-full.txt
          java -version > java-version-full.txt 2>&1
          {
            echo "PojavLauncher Renewed - APK verification"
            echo "date=$(date -u +%FT%TZ)"
            echo "source_commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "gradle=$(grep '^Gradle ' gradle-version-full.txt | head -1)"
            echo "java=$(head -1 java-version-full.txt)"
            echo "javac=$(javac -version 2>&1)"
            echo
            echo "== static verification =="
            echo "ultra_lite_preservation_and_safety_checks=passed (verify_ultra_optimization.py)"
            echo "repository_static_verification=passed (verify_static.py)"
            echo "offline_resolution_tests=passed (scripts/run_ultra_optimization_tests.sh)"
            echo "  scenarios: Fabric 1.20.1/LTW, Forge 1.20.1/GL4ES, NeoForge 1.21.1/Zink,"
            echo "  Quilt 1.19.2, Vanilla, shared-data, old runtime, installed detection,"
            echo "  required-dependency failure, incompatible conflict, exclusive culling group"
            echo
            for apk in PojavLauncher-Renewed-Full.apk PojavLauncher-Renewed-Noruntime.apk; do
              echo "=== $apk ==="
              echo "size_bytes=$(stat -c%s "$apk")"
              echo "sha256=$(sha256sum "$apk" | awk '{print $1}')"
              unzip -t "$apk" >/dev/null
              echo "zip_integrity=ok"
              aapt dump badging "$apk" | grep -E '^(package|sdkVersion|targetSdkVersion|native-code|application-label:)' || true
              apksigner verify "$apk" >/dev/null
              echo "apksigner_verify=ok"
              apksigner verify --print-certs "$apk" 2>/dev/null | grep -E 'Signer #1 certificate (DN|SHA-256 digest)' || true
              zipalign -c -v 4 "$apk" | tail -1
              echo "abis=$(unzip -l "$apk" | awk '/ lib\/[^\/]+\/.*\.so$/ {split($4,a,"/"); print a[2]}' | sort -u | tr '\n' ' ')"
              echo
            done
            echo "Not performed by CI: installation and runtime testing on a physical Android device,"
            echo "live Modrinth API queries, and end-to-end mod installation on a device."
          } | tee release-verification.txt
          : > apk-metadata.txt
          for apk in PojavLauncher-Renewed-Full.apk PojavLauncher-Renewed-Noruntime.apk; do
            badging=$(aapt dump badging "$apk")
            stem=${apk%.apk}
            pkg=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            vcode=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            vname=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            minsdk=$(printf '%s\n' "$badging" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p")
            targetsdk=$(printf '%s\n' "$badging" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p")
            abis=$(printf '%s\n' "$badging" | sed -n 's/^native-code: //p' | tr -d "'" | tr ' ' ',' | sed 's/,$//')
            size=$(stat -c%s "$apk")
            sha=$(sha256sum "$apk" | awk '{print $1}')
            signer=$(apksigner verify --print-certs "$apk" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            {
              echo "$stem.package=$pkg"
              echo "$stem.versionName=$vname"
              echo "$stem.versionCode=$vcode"
              echo "$stem.minSdk=$minsdk"
              echo "$stem.targetSdk=$targetsdk"
              echo "$stem.abis=$abis"
              echo "$stem.size_bytes=$size"
              echo "$stem.sha256=$sha"
              echo "$stem.debug_signer_sha256=$signer"
            } >> apk-metadata.txt
          done
          cat apk-metadata.txt

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          FULL_SIZE=$(grep '^PojavLauncher-Renewed-Full\.size_bytes=' apk-metadata.txt | cut -d= -f2)
          FULL_SHA=$(grep '^PojavLauncher-Renewed-Full\.sha256=' apk-metadata.txt | cut -d= -f2)
          NORUNTIME_SIZE=$(grep '^PojavLauncher-Renewed-Noruntime\.size_bytes=' apk-metadata.txt | cut -d= -f2)
          NORUNTIME_SHA=$(grep '^PojavLauncher-Renewed-Noruntime\.sha256=' apk-metadata.txt | cut -d= -f2)
          {
            echo "## PojavLauncher Renewed"
            echo
            echo "New in this build: **Ultra-Optimization**, a per-installation mod optimizer. It is a"
            echo "separate feature with its own screen, its own state and its own lifecycle; the existing"
            echo "**Ultra-Lite** launcher profile is untouched and keeps working exactly as before."
            echo
            echo "### Ultra-Optimization (new)"
            echo
            echo "Opens from **Settings -> Categories -> Ultra-Optimization** for the selected installation."
            echo
            echo "- Detects the exact Minecraft version and the loader of the selected installation (Fabric,"
            echo "  Forge, NeoForge, Quilt, or Vanilla) from its version JSON."
            echo "- Reads the active renderer and the selected Java runtime, and reports the compatibility"
            echo "  constraints it found. It never changes the renderer or the runtime."
            echo "- Queries the official Modrinth API (\`https://api.modrinth.com/v2\`) for the exact"
            echo "  version + loader pair, keeps only listed release/beta files with a primary JAR and a"
            echo "  SHA-512/SHA-1 hash, resolves required dependencies, and drops conflicts, unlisted,"
            echo "  archived and abandoned builds. No fixed mod list is installed."
            echo "- Evaluates the investigated candidates - FerriteCore, Lithium, Sodium, ModernFix,"
            echo "  ImmediatelyFast, Entity Culling, More Culling and Memory Leak Fix - and installs only"
            echo "  the ones that are actually compatible and missing, within a cost-aware selection budget."
            echo "- Sodium is validated against the renderer: it is offered on the LTW path for"
            echo "  Minecraft 1.17+ and otherwise skipped with an explicit reason (GL4ES is blocked by the"
            echo "  launcher for Sodium on 1.17+, and other renderers are not verified here)."
            echo "- Renderers are classified from the launcher's own identifiers: LTW, GL4ES (including the"
            echo "  legacy opengles2_4 / opengles2_5 aliases), Krypton Wrapper (NG-GL4ES), Zink, Legacy Zink,"
            echo "  Mesa, Freedreno, MobileGlues and SFPEW each carry the OpenGL ES / desktop-GL version their"
            echo "  RenderSpec actually requests. An unknown tag is treated as unknown, never as one of them."
            echo "- Downloads are staged, verified by size and hash, then moved into the installation's"
            echo "  mods directory. Existing files are never overwritten without confirmation, unrelated"
            echo "  mods are never removed, duplicates are skipped, and configs are left alone."
            echo "- **Restore** removes only what Ultra-Optimization installed and puts back anything it"
            echo "  displaced. State lives in \`<installation>/.ultra_optimization/state.json\`."
            echo "- On-demand only: no service, no polling, no startup scan, no automatic download, no"
            echo "  modpack handling, and a small bounded cache of Modrinth responses."
            echo
            echo "Vanilla installations are never modified and are never converted to a loader; shared"
            echo "game directories are refused so another installation cannot be touched."
            echo
            echo "### Ultra-Lite (unchanged)"
            echo
            echo "Global launcher profile under **Settings -> Categories -> Miscellaneous settings ->"
            echo "Performance profile**: reduced background work and cache, lower progress refresh rate,"
            echo "and an optional conservative heap size on low-RAM devices. Balanced / Ultra-Lite / Custom"
            echo "behave exactly as in the previous release; the profile files and defaults were verified"
            echo "byte-identical to the reviewed baseline by \`scripts/verify_ultra_optimization.py\`."
            echo
            echo "The two features are independent, so all four combinations work:"
            echo
            echo "| Ultra-Lite | Ultra-Optimization | Behaviour |"
            echo "| --- | --- | --- |"
            echo "| OFF | OFF | Normal launcher |"
            echo "| ON | OFF | Lightweight launcher |"
            echo "| OFF | ON | Minecraft optimized through mods |"
            echo "| ON | ON | Both simultaneously |"
            echo
            echo "### Supported Minecraft versions and loaders (as actually verified)"
            echo
            echo "Verified offline against fixture responses for the resolution policy, in these combinations:"
            echo
            echo "- Fabric 1.20.1 with LTW (dependency resolution, cost budget)"
            echo "- Forge 1.20.1 with GL4ES (Sodium correctly skipped with a reason)"
            echo "- NeoForge 1.21.1 with Zink (Sodium skipped, other mods offered)"
            echo "- Quilt 1.19.2 (Fabric builds accepted only for Quilt-capable projects)"
            echo "- Krypton Wrapper / NG-GL4ES: classified as its own family (OpenGL ES 3, desktop OpenGL 3.1"
            echo "  pinned via LIBGL_GL=31), Sodium withheld with a stated reason, non-rendering mods and their"
            echo "  required dependencies still offered"
            echo "- Standard GL4ES legacy aliases, and an unrecognised renderer tag as a conservative fallback"
            echo "- Vanilla, shared-game-directory and under-Java-runtime installations (refused, no changes)"
            echo
            echo "At runtime the exact Minecraft version and loader of the selected installation decide"
            echo "which mods Modrinth returns; unsupported or unverified combinations are skipped with an"
            echo "explanation instead of being installed. No live Modrinth query and no on-device run was"
            echo "performed by CI."
            echo
            echo "### Build information"
            echo
            echo "- Source: branch \`$GITHUB_REF_NAME\` at \`$GITHUB_SHA\`, built by GitHub Actions."
            echo "- Gradle 8.14.5 (official distribution, SHA-256 \`6f74b601422d6d6fc4e1f9a1ab6522f642c2fdcbc15ae33ebd30ba3d7198e854\`), JDK 17 (Temurin), Android SDK platform 36, build-tools 35.0.0/36.0.0, NDK 29.0.14206865, CMake 3.22.1."
            echo "- Debug variants with the standard Android debug keystore; no release APK is published"
            echo "  because this project has no release signing configuration (a release APK would be"
            echo "  unsigned and uninstallable)."
            echo "- Package \`$(grep '^PojavLauncher-Renewed-Full\.package=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  minSdk \`$(grep '^PojavLauncher-Renewed-Full\.minSdk=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  targetSdk \`$(grep '^PojavLauncher-Renewed-Full\.targetSdk=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  versionName \`$(grep '^PojavLauncher-Renewed-Full\.versionName=' apk-metadata.txt | cut -d= -f2)\`,"
            echo "  ABIs \`$(grep '^PojavLauncher-Renewed-Full\.abis=' apk-metadata.txt | cut -d= -f2 | tr ',' ' ')\`"
            echo "  (read from \`aapt dump badging\` on the built APKs; see \`apk-metadata.txt\`)."
            echo "- Verification: \`unzip -t\`, \`apksigner verify\`, \`zipalign -c -v 4\`, \`aapt dump badging\` - see \`release-verification.txt\`."
            echo
            echo "### APK assets and SHA-256"
            echo
            echo "| Asset | Size (bytes) | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`PojavLauncher-Renewed-Full.apk\` | $FULL_SIZE | \`$FULL_SHA\` |"
            echo "| \`PojavLauncher-Renewed-Noruntime.apk\` | $NORUNTIME_SIZE | \`$NORUNTIME_SHA\` |"
            echo
            echo "The **Full** APK bundles the Java runtimes. The **Noruntime** APK is smaller and lets the"
            echo "launcher download a runtime on first use. Install the variant that matches your device;"
            echo "do not mix them with the previous release's APKs."
            echo
            echo "### Installation and upgrade"
            echo
            echo "1. If a PojavLauncher fork is already installed, install this APK over it (same"
            echo "   \`net.kdt.pojavlaunch.debug\` package). If the signature differs, uninstall the old"
            echo "   debug build first; your \`games/PojavLauncher\` data directory is not removed by that."
            echo "2. Open **Settings -> Categories -> Ultra-Optimization** with the installation selected on"
            echo "   the main screen. The screen scans it once, on demand."
            echo "3. Review the mod list (will install / already installed / skipped and why), then press"
            echo "   **Optimize** and confirm. Progress and per-file results are shown on the same screen."
            echo "4. Press **Restore** to undo: only the files Ultra-Optimization installed are removed and"
            echo "   displaced files are put back."
            echo "5. Ultra-Lite stays where it was: **Settings -> Categories -> Miscellaneous settings ->"
            echo "   Performance profile**. Enabling both is supported."
            echo
            echo "### Known limitations"
            echo
            echo "- Renderer compatibility: Sodium is offered only on LTW for Minecraft 1.17+. With GL4ES the"
            echo "  launcher refuses that combination, so Ultra-Optimization skips Sodium instead of switching"
            echo "  renderers; Zink, MobileGlues, Mesa and other renderers are not treated as verified for"
            echo "  Sodium either. Sodium-family mods already present (Embeddium, Rubidium, Angelica) suppress"
            echo "  Sodium to avoid a conflict."
            echo "- Older Minecraft (before 1.17) and GL4ES-only devices get the non-rendering mods only."
            echo "- Krypton Wrapper (NG-GL4ES) is recognised and optimized, but it is a GL4ES translation"
            echo "  layer that pins emulated desktop OpenGL 3.1: Sodium and Sodium-family renderer mods are"
            echo "  withheld because Sodium's own documentation excludes OpenGL translation layers of this kind"
            echo "  and neither this repository nor the launcher's checks validate the combination - not"
            echo "  because the wrapper is considered unusable. The launcher applies neither its GL4ES Sodium"
            echo "  guard nor its version cutoff to Krypton, so Ultra-Optimization does not invent one either;"
            echo "  the reported on-device success with non-rendering mods is user evidence, not a CI result."
            echo "- Installations using a shared game directory, unresolved version aliases, or a Java"
            echo "  runtime older than the version requires are refused without changes."
            echo "- The mod list depends on what Modrinth currently publishes for that exact version/loader;"
            echo "  nothing is installed when no compatible, hashed, listed file exists."
            echo "- Debug build: expect debug-level overhead, and keep the previous release's APKs if you"
            echo "  need the earlier state."
            echo "- Not verified by CI: installing or launching on a physical Android device, live Modrinth"
            echo "  responses, and real frame-time measurements."
          } > release-notes.md
          cat release-notes.md

      # A verification-only run has to leave something the user can actually install, or the
      # build would be untestable: keep the APKs as run artifacts (never as a release asset).
      - name: Keep the debug APKs as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pojavlauncher-renewed-debug-apks
          path: |
            PojavLauncher-Renewed-Full.apk
            PojavLauncher-Renewed-Noruntime.apk
            release-verification.txt
            apk-metadata.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publication gate
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publication=enabled (explicit workflow_dispatch with the publish input)"
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "publication=skipped: the '${{ github.event_name }}' event only verifies and"
            echo "  builds both debug APKs. Run the workflow manually with the 'publish' input"
            echo "  checked to create or update the GitHub Release."
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the new GitHub Release
        if: steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          DIAG=/tmp/publish-diagnostics.txt
          : > "$DIAG"
          PUBLISH_FAILED=0
          note() { printf '%s\n' "$1" | tee -a "$DIAG"; }
          run_step() {
            label="$1"; shift
            if "$@" >>"$DIAG" 2>&1; then
              note "OK   $label"
            else
              code=$?
              note "FAIL $label (exit $code)"
              sed -e 's/^/     | /' "$DIAG" | tail -n 25
              PUBLISH_FAILED=1
            fi
          }
          ASSETS=()
          for candidate in PojavLauncher-Renewed-Full.apk PojavLauncher-Renewed-Noruntime.apk release-verification.txt apk-metadata.txt; do
            if [ -s "$candidate" ]; then ASSETS+=("$candidate"); else note "WARN missing asset $candidate"; fi
          done
          note "assets=${ASSETS[*]}"
          note "tag=$RELEASE_TAG sha=$GITHUB_SHA repo=$GITHUB_REPOSITORY"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            note "release exists"
            run_step "upload-assets" gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
            run_step "refresh-notes" gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id 2>>"$DIAG")
            note "release_id=$RELEASE_ID"
            if [ -n "$RELEASE_ID" ]; then
              run_step "refresh-target" gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f target_commitish="$GITHUB_SHA" --jq .tag_name
            else
              note "FAIL refresh-target (no release id)"
              PUBLISH_FAILED=1
            fi
          else
            note "creating release"
            run_step "create-release" gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          fi
          run_step "show-release" gh release view "$RELEASE_TAG" --json url,tagName,name,isPrerelease,targetCommitish,assets --jq '{url,tagName,name,isPrerelease,targetCommitish,assets:[.assets[]|{name,size,digest}]}'
          note "previous-release-check"
          run_step "show-previous" gh release view pojavlauncher-debug-apks-20261126 --json url,tagName --jq '{url,tagName}'
          note "result=$([ "$PUBLISH_FAILED" -eq 0 ] && echo ok || echo failed)"
          exit "$PUBLISH_FAILED"

      - name: Expose publishing diagnostics on the release
        if: always() && steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          DIAG=/tmp/publish-diagnostics.txt
          test -s "$DIAG" || { echo "no diagnostics to publish"; exit 0; }
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG does not exist; printing diagnostics instead"
            cat "$DIAG"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/body.md
          printf '\n<!-- publish-diagnostics (machine readable, not rendered)\n' >> /tmp/body.md
          sed -e 's/-->/_/g' "$DIAG" >> /tmp/body.md
          printf -- '-->\n' >> /tmp/body.md
          DIAG_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DIAG_ID" -F body=@/tmp/body.md --jq .html_url

  # ------------------------------------------------------------------------------------------
  # Publish the APKs that a previous run already built and verified: no rebuild, no new release,
  # and no existing asset is overwritten or deleted. Runs only while .github/RELEASE_PUBLISH is
  # committed, so an ordinary push can never republish anything.

  # ------------------------------------------------------------------------------------------
  # Publish the APKs that a previous run already built and verified: no rebuild, no new release,
  # and no existing asset is overwritten or deleted. Runs only while .github/RELEASE_PUBLISH is
  # committed, so an ordinary push can never republish anything.
  # ------------------------------------------------------------------------------------------
  publish-artifact:
    name: Publish the verified Krypton APKs to the existing release
    if: github.ref_name == 'arena/7535fc36-pojavlauncher'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      RELEASE_TAG: pojavlauncher-renewed-20261126
      SOURCE_RUN: '46045859676'
      ARTIFACT_ID: '15223245776'
      SOURCE_COMMIT: 1512463d51436fa36fd78285e54937f85912b670
      FULL_ASSET: PojavLauncher-Renewed-Krypton-Full.apk
      NORUNTIME_ASSET: PojavLauncher-Renewed-Krypton-Noruntime.apk
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 8
          persist-credentials: false

      - name: Publication gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -s .github/RELEASE_PUBLISH ]; then
            echo "publish=skipped (commit .github/RELEASE_PUBLISH to enable this job)"
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=1" >> "$GITHUB_OUTPUT"
          echo "publish=enabled by the committed marker:"
          head -5 .github/RELEASE_PUBLISH
          echo "source_run=$SOURCE_RUN artifact=$ARTIFACT_ID commit=$SOURCE_COMMIT"
          echo "=== the run that built these APKs ==="
          gh run view "$SOURCE_RUN" --json status,conclusion,headSha,workflowName,event \
            --jq '{workflowName,event,status,conclusion,headSha}'
          gh run view "$SOURCE_RUN" --json jobs \
            --jq '[.jobs[] | {name, conclusion, steps: [.steps[] | {n: .name, c: .conclusion}]}]' \
            > source-run-jobs.json
          cat source-run-jobs.json

      - name: Set up JDK 17
        if: steps.gate.outputs.enabled == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build-tools for apksigner
        if: steps.gate.outputs.enabled == '1'
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "build-tools;35.0.0" >/dev/null
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Fetch the APKs exactly as that run built them
        if: steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          if git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD; then
            echo "source_commit_is_ancestor=yes"
          else
            echo "source_commit_is_ancestor=NO - refusing to publish"
            exit 1
          fi
          # Nothing but CI configuration may differ from the commit these APKs came from.
          if git diff --quiet "$SOURCE_COMMIT" HEAD -- app_pojavlauncher scripts docs; then
            echo "app_tree_identical_to_source_commit=yes"
          else
            echo "app_tree_identical_to_source_commit=NO - refusing to publish"
            git diff --stat "$SOURCE_COMMIT" HEAD -- app_pojavlauncher scripts docs
            exit 1
          fi
          echo "=== full diff from the build commit (CI configuration only) ==="
          git diff --name-only "$SOURCE_COMMIT" HEAD
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/artifact.zip \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          ls -l /tmp/artifact.zip
          unzip -oq /tmp/artifact.zip -d /tmp/in
          ls -l /tmp/in
          for f in PojavLauncher-Renewed-Full.apk PojavLauncher-Renewed-Noruntime.apk release-verification.txt apk-metadata.txt; do
            test -s "/tmp/in/$f" || { echo "the artifact does not contain $f"; exit 1; }
          done
          cp /tmp/in/PojavLauncher-Renewed-Full.apk "$FULL_ASSET"
          cp /tmp/in/PojavLauncher-Renewed-Noruntime.apk "$NORUNTIME_ASSET"
          cp /tmp/in/apk-metadata.txt apk-metadata-krypton.txt
          cp /tmp/in/release-verification.txt release-verification-krypton.txt
          sha256sum "$FULL_ASSET" "$NORUNTIME_ASSET" | tee downloaded-sha256.txt

      - name: Verify integrity, metadata, signing and the Krypton code inside both APKs
        if: steps.gate.outputs.enabled == '1'
        shell: bash
        run: |
          set +e
          # actions/setup-job "shell: bash" implies -e -o pipefail, and a grep that correctly finds
          # nothing exits 1 - which must not abort the audit. Every verdict is recorded in FAIL
          # and turned into an exit status explicitly at the end of the step.
          set -u
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$JAVA_HOME/bin:$PATH"
          FAIL=0
          say() { printf '%s\n' "$1" | tee -a asset-verification.txt; }
          ok() { say "OK    $1"; }
          bad() { say "FAIL  $1"; FAIL=1; }
          say "=== provenance ==="
          say "built_from_commit=$SOURCE_COMMIT"
          say "built_by_run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          say "artifact_id=$ARTIFACT_ID"
          for apk in "$FULL_ASSET" "$NORUNTIME_ASSET"; do
            case "$apk" in
              *Krypton-Full.apk) origin=PojavLauncher-Renewed-Full ;;
              *) origin=PojavLauncher-Renewed-Noruntime ;;
            esac
            say "=== $apk (built as $origin.apk) ==="
            if unzip -t "$apk" >/dev/null 2>&1; then ok "$apk ZIP integrity (unzip -t)"; else bad "$apk ZIP integrity"; fi
            size=$(stat -c%s "$apk")
            sha=$(sha256sum "$apk" | awk '{print $1}')
            want_size=$(grep "^$origin.size_bytes=" apk-metadata-krypton.txt | cut -d= -f2)
            want_sha=$(grep "^$origin.sha256=" apk-metadata-krypton.txt | cut -d= -f2)
            say "$apk size_bytes=$size"
            say "$apk sha256=$sha"
            if [ "$size" = "$want_size" ]; then ok "$apk size matches the build-time metadata"; else bad "$apk size $size != build-time $want_size"; fi
            if [ "$sha" = "$want_sha" ]; then ok "$apk sha256 matches the build-time metadata"; else bad "$apk sha256 != build-time $want_sha"; fi
            if apksigner verify --verbose --print-certs "$apk" > /tmp/sig.txt 2>&1; then
              ok "$apk signature verifies with apksigner"
              sed -n 's/^Verifies: /  verifies: /p;s/^Signer #1 certificate DN: /  signer_dn: /p;s/^Signer #1 certificate SHA-256 digest: /  signer_sha256: /p;s/^Minimum SDK version: /  min_sdk: /p' /tmp/sig.txt | head -8 | tee -a asset-verification.txt
              recorded=$(grep "^$origin.debug_signer_sha256=" apk-metadata-krypton.txt | cut -d= -f2)
              live=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/sig.txt | head -1)
              if [ -n "$recorded" ] && [ "$recorded" = "$live" ]; then
                ok "$apk signer digest matches the build-time record ($live)"
              else
                bad "$apk signer digest $live != build-time $recorded"
              fi
            else
              bad "$apk failed apksigner verification"
              tail -5 /tmp/sig.txt | tee -a asset-verification.txt
            fi
            if zipalign -c -v 4 "$apk" >/dev/null 2>&1; then ok "$apk is zipaligned"; else say "NOTE  $apk zipalign check reported a difference"; fi
            for field in package versionName versionCode minSdk targetSdk abis; do
              value=$(grep "^$origin.$field=" apk-metadata-krypton.txt | cut -d= -f2)
              say "$apk build-time $field=${value:-not recorded}"
            done
          done
          say "=== Android verification recorded by the run that built them ==="
          for token in apksigner_verify zip_integrity abis=; do
            if grep -q -- "$token" release-verification-krypton.txt; then
              ok "release-verification-krypton.txt records $token"
            else
              bad "release-verification-krypton.txt lacks $token"
            fi
          done
          if grep -q "^source_commit=$SOURCE_COMMIT" release-verification-krypton.txt; then
            ok "the build log names the commit the APKs were made from ($SOURCE_COMMIT)"
          else
            bad "the build log does not name $SOURCE_COMMIT: $(grep '^source_commit=' release-verification-krypton.txt || echo none)"
          fi
          say "build log size_bytes lines: $(grep -c '^size_bytes=' release-verification-krypton.txt) recorded, first values: $(sed -n 's/^size_bytes=//p' release-verification-krypton.txt | head -2 | tr '\n' ' ')"
          say "build log asset headers: $(sed -n 's/^=== \(.*\) ===$/\1/p' release-verification-krypton.txt | tr '\n' ' ')"
          for apk in "$FULL_ASSET" "$NORUNTIME_ASSET"; do
            case "$apk" in
              *Krypton-Full.apk) origin=PojavLauncher-Renewed-Full ;;
              *) origin=PojavLauncher-Renewed-Noruntime ;;
            esac
            logged=$(grep "^$origin.size_bytes=" apk-metadata-krypton.txt | cut -d= -f2)
            actual=$(stat -c%s "$apk")
            if [ -n "$logged" ] && [ "$logged" = "$actual" ]; then
              ok "$apk size also matches the build-time record"
            else
              say "NOTE  $apk size cross-check skipped (recorded: ${logged:-none})"
            fi
          done
          say "=== Krypton Wrapper compatibility code inside classes.dex ==="
          rm -rf /tmp/dex; mkdir -p /tmp/dex
          for apk in "$FULL_ASSET" "$NORUNTIME_ASSET"; do
            d=/tmp/dex/"$apk"; mkdir -p "$d"
            unzip -oq "$apk" 'classes*.dex' -d "$d"
            for marker in \
              "Krypton Wrapper (NG-GL4ES, labelled OpenGL ES 3.2) - 26.2 and lower" \
              "Sodium skipped: Krypton Wrapper (NG-GL4ES) is a GL4ES translation layer" \
              "Krypton family, desktop OpenGL" \
              "never as LTW or Zink" \
              "opengles_nggl4es"
            do
              n=$(cat "$d"/classes*.dex | grep -a -o -F "$marker" | wc -l | tr -d ' ')
              if [ "$n" -ge 1 ]; then ok "$apk contains the marker: $marker"; else bad "$apk is missing: $marker"; fi
            done
            stale=$(cat "$d"/classes*.dex | grep -a -o -F "Krypton Wrapper (OpenGL ES 3.2)" | wc -l | tr -d ' ')
            stale=${stale:-0}
            if [ "$stale" -eq 0 ]; then
              ok "$apk has no pre-Krypton detector wording, so it is not an older artifact"
            else
              bad "$apk still carries the superseded detector wording"
            fi
          done
          say "=== result ==="
          say "verification_failures=$FAIL"
          if [ "$FAIL" -ne 0 ]; then
            # Surface the report where it can be read back over the API: each failing check
            # becomes a check-run annotation (the raw job log is not reachable from here).
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              printf '::error title=APK verification failed::%s\n' "${line:0:400}"
            done < <(grep '^FAIL' asset-verification.txt | sed 's/%/%25/g' | head -20)
            printf '::error title=build log excerpt::%s\n' \
              "$(sed -n 's/^=== //p;s/ ===$//p;s/%/%25/g' release-verification-krypton.txt | head -6 | tr '\n' ' ')"
          fi
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Expose the verification report when verification does not pass
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          {
            echo "=== workspace ==="
            ls -l
            echo "=== downloaded-sha256.txt ==="
            cat downloaded-sha256.txt 2>/dev/null
            echo "=== apk-metadata-krypton.txt (head 6) ==="
            head -6 apk-metadata-krypton.txt 2>/dev/null
            echo "=== release-verification-krypton.txt (head 12) ==="
            head -12 release-verification-krypton.txt 2>/dev/null
            echo "=== asset-verification.txt ==="
            cat asset-verification.txt 2>/dev/null
          } > /tmp/diagnostic.txt
          test -s /tmp/diagnostic.txt || echo "the verification step wrote nothing at all" >> /tmp/diagnostic.txt
          # GitHub truncates an annotation message, so the full report goes into a comment on
          # the commit as well; the short annotations only carry the verdict lines.
          brief=$(grep -E '^FAIL|^NOTE|verification_failures' asset-verification.txt 2>/dev/null | head -25 | tr '\n' '|')
          printf '::error title=failed checks::%s\n' "report_bytes=$(wc -c < asset-verification.txt 2>/dev/null) brief=${brief:0:1300}"
          lastline=$(tail -1 asset-verification.txt 2>/dev/null | tr -d '\n')
          printf '::error title=last report line::%s\n' "last=${lastline:0:300}"
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@- < /tmp/diagnostic.txt --jq .html_url > /dev/null 2>&1 \
            || printf '::warning title=the full report could not be posted as a commit comment::read the annotations above\n'

      - name: Add both APKs to the existing release, keeping every current asset
        if: steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q "verification_failures=0" asset-verification.txt || { echo "refusing to publish: verification did not pass" >&2; exit 1; }
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name][]' > /tmp/before_names.txt
          echo "=== assets before ==="; cat /tmp/before_names.txt
          gh release upload "$RELEASE_TAG" "$FULL_ASSET" "$NORUNTIME_ASSET" release-verification-krypton.txt apk-metadata-krypton.txt --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name][]' > /tmp/after_names.txt
          echo "=== assets after ==="; cat /tmp/after_names.txt
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            grep -qxF "$name" /tmp/after_names.txt || { echo "existing asset vanished: $name" >&2; exit 1; }
          done < /tmp/before_names.txt
          for required in "$FULL_ASSET" "$NORUNTIME_ASSET"; do
            grep -qxF "$required" /tmp/after_names.txt || { echo "required asset missing: $required" >&2; exit 1; }
          done
          echo "existing_assets_preserved=yes"
          for pair in "$FULL_ASSET=PojavLauncher-Renewed-Full" "$NORUNTIME_ASSET=PojavLauncher-Renewed-Noruntime"; do
            required=${pair%%=*}; origin=${pair##*=}
            want=$(grep "^$origin.sha256=" apk-metadata-krypton.txt | cut -d= -f2)
            got=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq ".assets[] | select(.name == \"$required\") | .digest")
            echo "digest_check $required github=$got built=sha256:$want"
            [ "$got" = "sha256:$want" ] || { echo "GitHub's stored digest for $required differs from the built APK" >&2; exit 1; }
          done
          echo "digest_match_with_built_apks=yes"

      - name: Confirm both APKs are downloadable without authentication
        if: steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e   # explicit verdicts below; an absent grep match must not abort
          FAIL=0
          : > public-check.txt
          for name in "$FULL_ASSET" "$NORUNTIME_ASSET"; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "anonymous HEAD for $name -> http=$code"
            case "$code" in 302|200) : ;; *) echo "the public link did not resolve"; FAIL=1 ;; esac
            if curl -sfL -o "/tmp/$name" "$url"; then
              got=$(sha256sum "/tmp/$name" | awk '{print $1}')
              size=$(stat -c%s "/tmp/$name")
              want=$(sha256sum "$name" | awk '{print $1}')
              want_size=$(stat -c%s "$name")
              if [ "$got" = "$want" ] && [ "$size" = "$want_size" ]; then
                echo "PUBLIC_OK $name size=$size sha256=$got url=$url" | tee -a public-check.txt
              else
                echo "PUBLIC_MISMATCH $name got=$got/$size want=$want/$want_size" | tee -a public-check.txt
                FAIL=1
              fi
            else
              echo "PUBLIC_FAIL $name could not be downloaded anonymously" | tee -a public-check.txt
              FAIL=1
            fi
          done
          echo "=== release state reported by GitHub ==="
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '{tag:.tag_name,prerelease,target:.target_commitish,assets:[.assets[]|{name,size,state,contentType,digest,browser_download_url}]}'
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Record the evidence in the release notes
        if: steps.gate.outputs.enabled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          test -n "$RELEASE_ID" || { echo "cannot resolve the release id" >&2; exit 1; }
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/body.md
          awk 'index($0, "krypton-assets-evidence"){exit} {print}' /tmp/body.md > /tmp/body.base.md
          {
            echo
            echo '<!-- krypton-assets-evidence -->'
            echo '### Krypton Wrapper (NG-GL4ES) build - assets and verification'
            echo
            echo 'Ultra-Optimization now classifies **Krypton Wrapper (NG-GL4ES)** as its own renderer family'
            echo '(`opengles_nggl4es`, `libng_gl4es.so`, desktop OpenGL 3.1 pinned over OpenGL ES 3): the'
            echo 'wrapper is recognized and optimized, and renderer-dependent mods such as Sodium are'
            echo 'withheld with an explicit reason instead of the installation being refused.'
            echo
            echo "- Built and verified by [run $SOURCE_RUN](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN)"
            echo "  from commit \`$SOURCE_COMMIT\`. The uploaded bytes are that run's CI artifact"
            echo "  \`$ARTIFACT_ID\`, not a rebuild; the upload commit differs only in CI configuration."
            echo "- Added as new assets. Every asset already on this release is preserved untouched."
            echo
            for name in "$FULL_ASSET" "$NORUNTIME_ASSET" release-verification-krypton.txt apk-metadata-krypton.txt; do
              printf '* [`%s`](https://github.com/%s/releases/download/%s/%s) - %s bytes, SHA-256 `%s`\n' \
                "$name" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$name" \
                "$(stat -c%s "$name")" "$(sha256sum "$name" | awk '{print $1}')"
            done
            echo
            echo 'Both APKs were fetched again over their public links with no credentials and matched the'
            echo 'built files byte for byte. Automated verification:'
            echo
            echo '<details><summary>verification log</summary>'
            echo
            echo '```'
            cat asset-verification.txt
            cat public-check.txt
            echo '```'
            echo
            echo '</details>'
          } > /tmp/section.md
          cat /tmp/body.base.md /tmp/section.md > /tmp/body.new.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F body=@/tmp/body.new.md \
            --jq '{tag_name, name, target_commitish, prerelease, html_url}'
          echo "=== final release state ==="
          gh release view "$RELEASE_TAG" --json url,tagName,isPrerelease,targetCommitish,assets \
            --jq '{url,tagName,isPrerelease,targetCommitish,assets:[.assets[]|{name,size,state,digest}]}'
          echo "=== the previous APK release must still be intact ==="
          gh release view pojavlauncher-debug-apks-20261126 --json url,tagName,assets \
            --jq '{url,tagName,assets:[.assets[].name]}'

      - name: Report a disabled run
        if: steps.gate.outputs.enabled != '1'
        shell: bash
        run: echo "publish job skipped; the release was not touched"
