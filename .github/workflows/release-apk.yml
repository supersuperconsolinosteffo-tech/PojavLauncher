name: Release debug APKs

on:
  push:
    branches:
      - arena/7535fc36-pojavlauncher
    paths:
      - .github/workflows/release-apk.yml

permissions:
  contents: write

concurrency:
  group: release-debug-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CURSEFORGE_API_KEY: DUMMY
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/7535fc36-pojavlauncher
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Install official Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER='${{ steps.sdk.outputs.sdkmanager }}'
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          "$SDKMANAGER" --list_installed | grep -E 'android-36|35\.0\.0|36\.0\.0|29\.0\.14206865|3\.22\.1' || true

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Gradle and Java versions
        shell: bash
        run: |
          set -euo pipefail
          gradle --version | tee gradle-version.txt
          java -version 2>&1 | tee java-version.txt
          javac -version 2>&1 | tee -a java-version.txt

      - name: Build both debug APK variants
        shell: bash
        run: |
          set -euo pipefail
          gradle :app_pojavlauncher:assembleNoruntimeDebug :app_pojavlauncher:assembleFullDebug \
            --no-daemon --console=plain

      - name: Verify and describe APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          export PATH="$BT:$JAVA_HOME/bin:$PATH"
          FULL=app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
          NORUNTIME=app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk
          cp -f "$FULL" PojavLauncher-full-debug.apk
          cp -f "$NORUNTIME" PojavLauncher-noruntime-debug.apk
          gradle --version > gradle-version-full.txt
          java -version > java-version-full.txt 2>&1
          {
            echo "PojavLauncher GitHub Release APK verification"
            echo "date=$(date -u +%FT%TZ)"
            echo "source_commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "gradle=$(grep '^Gradle ' gradle-version-full.txt | head -1)"
            echo "java=$(head -1 java-version-full.txt)"
            echo
            for apk in PojavLauncher-full-debug.apk PojavLauncher-noruntime-debug.apk; do
              echo "=== $apk ==="
              echo "size_bytes=$(stat -c%s "$apk")"
              echo "sha256=$(sha256sum "$apk" | awk '{print $1}')"
              unzip -t "$apk" >/dev/null
              echo "unzip_test=ok"
              aapt dump badging "$apk" | grep -E '^(package|sdkVersion|targetSdkVersion|native-code|application-label:)' || true
              apksigner verify "$apk" >/dev/null
              echo "apksigner_verify=ok"
              apksigner verify --print-certs "$apk" 2>/dev/null | grep -E 'Signer #1 certificate (DN|SHA-256 digest)' || true
              zipalign -c -v 4 "$apk" | tail -1
              echo "abis=$(unzip -l "$apk" | awk '/ lib\/[^\/]+\/.*\.so$/ {split($4,a,\"/\"); print a[2]}' | sort -u | tr '\n' ' ')"
              echo
            done
            echo "Physical-device installation and runtime testing were not performed by CI."
          } | tee release-verification.txt
          {
            echo "# PojavLauncher debug APKs"
            echo
            echo "Built directly by GitHub Actions from branch \`$GITHUB_REF_NAME\` at commit \`$GITHUB_SHA\`."
            echo "This is a debug/prerelease build. Physical-device installation and runtime testing remain user-side validation."
            echo
            echo "Assets:"
            echo
            for apk in PojavLauncher-full-debug.apk PojavLauncher-noruntime-debug.apk; do
              echo "- \`$apk\` — $(stat -c%s "$apk") bytes, SHA-256 \`$(sha256sum "$apk" | awk '{print $1}')\`"
            done
            echo
            echo "Package: \`net.kdt.pojavlaunch.debug\`; minSdk 23; targetSdk 36; ABIs: arm64-v8a, armeabi-v7a, x86, x86_64."
            echo "Debug signer SHA-256: \`d0d0886a0d7e3486e6627f9b8011027fe3c6b0fb09424530b6d7be14f8c2cc33\`."
            echo
            echo "See \`release-verification.txt\` for the complete APK verification output."
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=pojavlauncher-debug-apks-20261126
          ASSETS=(
            PojavLauncher-full-debug.apk
            PojavLauncher-noruntime-debug.apk
            release-verification.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG from $GITHUB_SHA"
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "PojavLauncher debug APKs (2026-11-26)" \
              --notes-file release-notes.md \
              --prerelease
          fi
          echo "=== published release ==="
          gh release view "$TAG" --json url,tagName,isPrerelease,assets \
            --jq '{url,tagName,isPrerelease,assets:[.assets[].name]}'
